name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the conformance table matches the vectors
        if: runner.os == 'Linux'
        run: python3 scripts/conformance.py --check

      - name: interfaces are up to date
        run: |
          moon info --target all && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: the API page follows the interfaces
        run: |
          python3 scripts/gen_api.py || python scripts/gen_api.py
          git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code docs/api.html

  # A second implementation for everything the library answers: the official
  # test files cover the algorithms, and these two cover the data behind them,
  # code point by code point, for every property and every normalization form.
  differential:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: the other implementations, at the same Unicode version
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "unicodedata2==17.0.0" "wcwidth==0.2.14"
          npm install --no-save --no-package-lock --prefix scripts/differential "@unicode/unicode-17.0.0@2.1.0"

      - name: every answer the library gives about a code point
        run: |
          moon update
          moon build --target native --release src/tools/dump_ucd
          ./_build/native/release/build/tools/dump_ucd/dump_ucd > "$RUNNER_TEMP/ucd.tsv"
          wc -l "$RUNNER_TEMP/ucd.tsv"

      - name: compare with unicodedata2 and wcwidth
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/differential/compare.py "$RUNNER_TEMP/ucd.tsv"

      - name: compare with unicode-js
        run: node scripts/differential/compare.mjs "$RUNNER_TEMP/ucd.tsv"

      - name: how many cases the official suites hold
        run: python3 scripts/conformance.py
